
<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>ერთი კითხვა ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#09070a;
    --card:#120d12;
    --rose:#ff6f9d;
    --rose2:#ff9abb;
    --white:#fff8fb;
    --muted:#bcaeb5;
    --line:rgba(255,255,255,.10);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:var(--bg);
    color:var(--white);
    font-family:"Noto Sans Georgian",sans-serif;
}

body{
    min-height:100svh;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 50% 20%,rgba(255,75,130,.12),transparent 32%),
        radial-gradient(circle at 10% 90%,rgba(255,40,100,.07),transparent 28%);
    z-index:-2;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.035;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
    z-index:-1;
}

.page{
    min-height:100svh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px 17px;
}

.container{
    width:min(470px,100%);
    text-align:center;
}

.top-label{
    font-size:11px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:#9e8e96;
    margin-bottom:18px;
}

/* VIDEO */

.video-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:30px;
}

video{
    /*
       contain + auto height ნიშნავს, რომ ვიდეო
       მთლიანად გამოჩნდება და არ მოიჭრება.
    */
    width:100%;
    height:auto;
    max-height:55vh;
    object-fit:contain;

    display:block;

    background:#080608;

    border-radius:22px;
    border:1px solid var(--line);

    box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        0 0 45px rgba(255,70,125,.07);
}

/* QUESTION */

.question-area{
    position:relative;
    padding:4px 0 10px;
}

.small-line{
    color:#a99aa2;
    font-size:12px;
    margin-bottom:12px;
}

.question{
    margin:0 auto;
    max-width:420px;
    font-size:clamp(28px,7vw,40px);
    line-height:1.28;
    font-weight:700;
    letter-spacing:-1px;
}

.question span{
    color:var(--rose2);
}

.subtext{
    margin:13px auto 0;
    color:#8f8189;
    font-size:13px;
    min-height:20px;

    transition:
        opacity .25s ease,
        transform .25s ease;
}

/* BUTTONS */

.buttons{
    position:relative;
    min-height:190px;
    margin-top:25px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
}

.btn{
    border:0;
    font-family:inherit;
    cursor:pointer;
    touch-action:manipulation;
    font-weight:700;

    transition:
        transform .45s cubic-bezier(.2,.9,.2,1),
        width .55s cubic-bezier(.2,.9,.2,1),
        height .55s cubic-bezier(.2,.9,.2,1),
        box-shadow .55s ease;
}

/* KI */

.yes{
    width:145px;
    height:58px;

    border-radius:18px;

    color:#1a0910;

    background:
        linear-gradient(
            135deg,
            #ffc0d4,
            #ff6f9d
        );

    box-shadow:
        0 12px 32px rgba(255,72,130,.25),
        inset 0 1px 0 rgba(255,255,255,.65);

    font-size:17px;

    position:relative;
    z-index:5;
}

.yes:active{
    transform:scale(.96);
}

/* ARA */

.no{
    width:112px;
    height:50px;

    border-radius:15px;

    background:#171117;
    color:#c9bdc4;

    border:1px solid rgba(255,255,255,.10);

    font-size:14px;

    position:relative;
    z-index:10;
}

.no:active{
    transform:scale(.94);
}

.counter{
    margin-top:4px;
    font-size:11px;
    color:#695e65;
    letter-spacing:1px;
}

/* SUCCESS SCREEN */

.success{
    position:fixed;
    inset:0;

    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:22px;

    background:#09070a;

    opacity:0;
    visibility:hidden;
    pointer-events:none;

    transform:scale(1.03);

    transition:
        opacity .55s ease,
        visibility .55s ease,
        transform .55s ease;
}

.success.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transform:scale(1);
}

.success-content{
    width:min(520px,100%);

    text-align:center;

    transform:
        translateY(35px)
        scale(.94);

    transition:
        transform .7s cubic-bezier(.2,.9,.2,1);
}

.success.show .success-content{
    transform:
        translateY(0)
        scale(1);
}

/* SECOND VIDEO */

.second-video-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;

    margin-bottom:25px;
}

#video1{
    width:100%;
    height:auto;
    max-height:60vh;

    object-fit:contain;

    display:block;

    border-radius:22px;

    background:#080608;

    border:1px solid rgba(255,255,255,.10);

    box-shadow:
        0 25px 80px rgba(0,0,0,.65),
        0 0 50px rgba(255,70,125,.10);
}

.success-title{
    margin:0;

    font-size:clamp(28px,8vw,44px);

    line-height:1.22;

    font-weight:800;

    color:#fff8fb;
}

.success-title span{
    color:var(--rose2);
}

.success-text{
    margin:15px auto 0;

    max-width:390px;

    color:#b3a5ac;

    font-size:15px;

    line-height:1.7;
}

/* SPARKLES */

.spark{
    position:fixed;

    width:5px;
    height:5px;

    border-radius:50%;

    background:#ff91b5;

    pointer-events:none;

    z-index:200;

    animation:
        fly 900ms ease-out forwards;
}

@keyframes fly{

    from{
        transform:
            translate(0,0)
            scale(1);

        opacity:1;
    }

    to{
        transform:
            translate(var(--x),var(--y))
            scale(0);

        opacity:0;
    }
}

/* MOBILE */

@media(max-width:420px){

    .page{
        padding:
            20px 14px;
    }

    .video-wrap{
        margin-bottom:25px;
    }

    video{
        max-height:48vh;
        border-radius:18px;
    }

    .question{
        font-size:28px;
    }

    .buttons{
        min-height:180px;
    }

    .yes{
        width:150px;
        height:60px;
    }

    .no{
        width:108px;
    }

    #video1{
        max-height:55vh;
        border-radius:18px;
    }
}
</style>
</head>

<body>

<!-- =========================================
     FIRST SCREEN
========================================= -->

<main class="page">

    <div class="container">

        <div class="top-label">
            ერთი პატარა კითხვა
        </div>

        <div class="video-wrap">

            <video
                id="video"
                src="video.mp4"
                autoplay
                muted
                playsinline
                preload="auto">
            </video>

        </div>

        <section class="question-area">

            <div class="small-line">
                ახლა კი მთავარი...
            </div>

            <h1 class="question">
                გახდები ჩემი
                <span>შეყვარებული</span>?
            </h1>

            <div
                class="subtext"
                id="message">
                მგონი პასუხი უკვე ვიცი... ❤️
            </div>

        </section>

        <div
            class="buttons"
            id="buttons">

            <button
                class="btn yes"
                id="yesBtn">
                კი ❤️
            </button>

            <button
                class="btn no"
                id="noBtn">
                არა
            </button>

        </div>

        <div
            class="counter"
            id="counter">
            ერთი პასუხი აირჩიე
        </div>

    </div>

</main>


<!-- =========================================
     SECOND SCREEN AFTER "KI"
========================================= -->

<div
    class="success"
    id="success">

    <div class="success-content">

        <div class="second-video-wrap">

            <video
                id="video1"
                src="video1.mp4"
                autoplay
                playsinline
                preload="auto">
            </video>

        </div>

        <h2 class="success-title">
            ჰაჰ, ასეც ვიცოდი <span>!!! ❤️</span>
        </h2>

        <p class="success-text">
            როგორც იქნა, პასუხიც მივიღე. ❤️
        </p>

    </div>

</div>


<script>

const yesBtn =
    document.getElementById("yesBtn");

const noBtn =
    document.getElementById("noBtn");

const message =
    document.getElementById("message");

const counter =
    document.getElementById("counter");

const success =
    document.getElementById("success");

const video =
    document.getElementById("video");

const video1 =
    document.getElementById("video1");


let noCount = 0;


/* -----------------------------------------
   ტექსტები ყოველი "არა"-სთვის
----------------------------------------- */

const messages = [

    "არ გინდა? კიდევ სცადე. ❤️",

    "კარგად დაფიქრდი...",

    "არა ნამდვილად? 🥹",

    "მგონი უბრალოდ მაწვალებ...",

    "კი-ს ღილაკი უფრო მოგწონს, არა? 😌",

    "კიდევ ერთხელ დაფიქრდი ❤️",

    "უკვე ძალიან დიდი გახდა...",

    "კი მაინც გელოდება.",

    "ბოლო შანსი...",

    "კარგი, მაგრამ პასუხი მაინც ვიცი 😭"

];


const counterTexts = [

    "პირველი მცდელობა",

    "კიდევ ერთხელ",

    "კიდევ ფიქრობ?",

    "ნამდვილად არა?",

    "კი იზრდება...",

    "უკვე დიდია",

    "ძალიან დიდია",

    "თითქმის მთელ სივრცეს იკავებს",

    "კიდევ ერთი არა?",

    "კარგი... 😭"

];


/* -----------------------------------------
   KI-ს ზომის გაზრდა

   ახლა ბევრად სწრაფად იზრდება.
   მაქსიმუმი ეკრანის ~78%-ია,
   ამიტომ მთელ ეკრანს არ დაფარავს.
----------------------------------------- */

function updateYesSize(){

    const maxWidth =
        Math.min(
            window.innerWidth * 0.78,
            420
        );

    const maxHeight = 125;

    const width =
        Math.min(
            145 + noCount * 42,
            maxWidth
        );

    const height =
        Math.min(
            58 + noCount * 10,
            maxHeight
        );

    const fontSize =
        Math.min(
            17 + noCount * 2.2,
            28
        );

    yesBtn.style.width =
        width + "px";

    yesBtn.style.height =
        height + "px";

    yesBtn.style.fontSize =
        fontSize + "px";

    yesBtn.style.boxShadow =
        `
        0 ${12 + noCount * 3}px
        ${32 + noCount * 5}px
        rgba(255,72,130,.35),
        inset 0 1px 0
        rgba(255,255,255,.65)
        `;
}


/* -----------------------------------------
   ტექსტის შეცვლა
----------------------------------------- */

function animateMessage(text){

    message.style.opacity = "0";

    message.style.transform =
        "translateY(6px)";

    setTimeout(() => {

        message.textContent = text;

        message.style.opacity = "1";

        message.style.transform =
            "translateY(0)";

    },180);
}


/* -----------------------------------------
   პატარა გულების ეფექტი
----------------------------------------- */

function createSparkles(){

    for(let i=0;i<20;i++){

        const spark =
            document.createElement("div");

        spark.className =
            "spark";

        spark.style.left =
            "50%";

        spark.style.top =
            "50%";

        spark.style.setProperty(
            "--x",
            `${(Math.random()-.5) *
            window.innerWidth}px`
        );

        spark.style.setProperty(
            "--y",
            `${(Math.random()-.5) *
            window.innerHeight}px`
        );

        document.body.appendChild(spark);

        setTimeout(() => {

            spark.remove();

        },950);
    }
}


/* -----------------------------------------
   "არა"
----------------------------------------- */

noBtn.addEventListener(
    "click",
    () => {

        noCount++;

        updateYesSize();

        const index =
            Math.min(
                noCount - 1,
                messages.length - 1
            );

        animateMessage(
            messages[index]
        );

        counter.textContent =
            counterTexts[
                Math.min(
                    noCount - 1,
                    counterTexts.length - 1
                )
            ];


        /*
           არა-ს პატარა playful მოძრაობა
        */

        noBtn.animate(

            [
                {
                    transform:
                        "translateX(0)"
                },

                {
                    transform:
                        "translateX(-6px)"
                },

                {
                    transform:
                        "translateX(6px)"
                },

                {
                    transform:
                        "translateX(0)"
                }
            ],

            {
                duration:360,
                easing:"ease-out"
            }

        );


        /*
           ბევრჯერ "არა"-ს დაჭერის შემდეგ
           ღილაკი ოდნავ მცირდება,
           რათა "კი" ვიზუალურად დომინანტური გახდეს.
        */

        if(noCount >= 6){

            const scale =
                Math.max(
                    .84,
                    1 - (noCount - 6) * .025
                );

            noBtn.style.transform =
                `scale(${scale})`;
        }

    }
);


/* -----------------------------------------
   "კი"
----------------------------------------- */

yesBtn.addEventListener(
    "click",
    () => {

        createSparkles();

        /*
           პირველი ვიდეო ჩერდება
        */

        video.pause();

        /*
           ახალი ეკრანი იხსნება
        */

        success.classList.add("show");

        /*
           მეორე ვიდეო თავიდან იწყებს
           დაკვრას
        */

        video1.currentTime = 0;

        video1.play().catch(() => {});

    }
);


/* -----------------------------------------
   პირველი ვიდეო:
   დასრულების შემდეგ თავიდან
----------------------------------------- */

video.addEventListener(
    "ended",
    () => {

        video.currentTime = 0;

        video.play().catch(() => {});

    }
);


/* -----------------------------------------
   მეორე ვიდეო:
   დასრულების შემდეგ თავიდან
----------------------------------------- */

video1.addEventListener(
    "ended",
    () => {

        video1.currentTime = 0;

        video1.play().catch(() => {});

    }
);


/* -----------------------------------------
   გვერდის ჩატვირთვისას
----------------------------------------- */

window.addEventListener(
    "load",
    () => {

        video.play().catch(() => {});

        /*
           მეორე ვიდეო თავიდან დამალულია,
           ამიტომ აქ არ ვრთავთ.
        */

    }
);


/* -----------------------------------------
   ეკრანის ზომის ცვლილება
----------------------------------------- */

window.addEventListener(
    "resize",
    () => {

        if(noCount > 0){

            updateYesSize();

        }

    }
);

</script>

</body>
</html>
